name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Unzip
        run: unzip -q *.zip
      - name: Gradle surumunu guncelle
        run: sed -i 's/gradle-9.4.0-bin/gradle-9.5.0-bin/' voxy-low-spec/gradle/wrapper/gradle-wrapper.properties
      - name: Build
        working-directory: voxy-low-spec
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: voxy-low-spec-jar
          path: voxy-low-spec/build/libs/*.jar
